stage:
  id: 1
  slug: foundation
  title: Foundation
  description: Первый учебный блок для старта в backend и AI/ML.

topics:
  - id: 1
    slug: go-basics
    title: Go Basics
    description: Базовые понятия Go для старта в backend-разработке.
  - id: 2
    slug: python-basics
    title: Python Basics
    description: База Python для сценариев, автоматизации и AI/ML.
  - id: 3
    slug: ai-ml-basics
    title: AI/ML Basics
    description: Вводный блок по искусственному интеллекту и машинному обучению.
  - id: 4
    slug: interview-basics
    title: Interview Basics
    description: Как уверенно отвечать на технические вопросы на собеседовании.

questions:
  - id: 1
    topic_id: 1
    level: beginner
    question: Что такое Go?
    simple_answer: Go — это простой и быстрый язык программирования для backend, инструментов и сервисов.
    interview_answer: Go — компилируемый язык с акцентом на простоту, скорость сборки и конкурентность.
    real_usage: Используется для API, микросервисов, CLI и инфраструктурных сервисов.
    follow_up_questions:
      - Чем Go отличается от Python?
      - Почему Go удобен для backend?
    practice_task: Напишите короткую программу, которая выводит строку приветствия.
  - id: 2
    topic_id: 1
    level: beginner
    question: Что такое package main?
    simple_answer: Это пакет, из которого Go запускает приложение как исполняемую программу.
    interview_answer: package main обозначает точку входа для исполняемого Go-приложения.
    real_usage: Используется в сервисах, CLI и любых приложениях, которые нужно запускать как отдельный процесс.
    follow_up_questions:
      - Чем package main отличается от обычного пакета?
      - Что произойдёт без package main?
    practice_task: Создайте файл main.go с пакетом main.
  - id: 3
    topic_id: 1
    level: beginner
    question: Зачем нужна функция main?
    simple_answer: Это стартовая функция программы.
    interview_answer: Функция main — это точка входа. В неё передаётся управление после запуска программы.
    real_usage: Это основа любого исполняемого Go-сервиса и утилиты.
    follow_up_questions:
      - Может ли быть несколько функций main?
      - Что делает runtime при запуске main?
    practice_task: Сделайте main и выведите одну строку в консоль.
  - id: 4
    topic_id: 1
    level: beginner
    question: Что такое go.mod?
    simple_answer: Это файл, где описан модуль и его зависимости.
    interview_answer: go.mod хранит имя модуля, версию Go и список зависимостей.
    real_usage: Используется во всех современных Go-проектах для управления зависимостями.
    follow_up_questions:
      - Что такое модуль в Go?
      - Как go.mod связан с go.sum?
    practice_task: Создайте новый модуль командой go mod init.
  - id: 5
    topic_id: 1
    level: beginner
    question: Что такое переменная?
    simple_answer: Это именованное место для хранения значения.
    interview_answer: Переменная связывает имя и значение и позволяет хранить данные в программе.
    real_usage: В backend-коде переменные хранят запросы, ответы и промежуточные результаты.
    follow_up_questions:
      - Чем переменная отличается от константы?
      - Когда значение переменной меняется?
    practice_task: Объявите числовую переменную с количеством учебных вопросов.
  - id: 6
    topic_id: 1
    level: beginner
    question: Чем var отличается от :=?
    simple_answer: var — явное объявление, := — короткая запись с выводом типа.
    interview_answer: var можно использовать с явным типом, а := работает только внутри функций и требует хотя бы одну новую переменную.
    real_usage: В Go часто используют := для локальных переменных и var там, где нужна явность.
    follow_up_questions:
      - Когда := использовать нельзя?
      - Почему иногда выбирают var вместо :=?
    practice_task: Объявите одну переменную через var и одну через :=.
  - id: 7
    topic_id: 1
    level: beginner
    question: Что такое тип данных?
    simple_answer: Это описание того, какие значения можно хранить в переменной.
    interview_answer: Тип данных определяет набор допустимых значений и операций.
    real_usage: Типы данных нужны в схемах, API, логике расчётов и валидации входных данных.
    follow_up_questions:
      - Почему типы важны для надёжности?
      - Чем int отличается от string?
    practice_task: Создайте переменные разных типов и выведите их значения.
  - id: 8
    topic_id: 1
    level: beginner
    question: Что такое struct?
    simple_answer: Это составной тип данных для хранения связанных полей.
    interview_answer: struct помогает сгруппировать данные в одну сущность, например пользователя или вопрос API.
    real_usage: В backend struct часто описывает DTO, доменные модели и ответы сервера.
    follow_up_questions:
      - Чем struct отличается от map?
      - Когда struct удобнее всего использовать?
    practice_task: Опишите struct для учебной темы с тремя полями.
  - id: 9
    topic_id: 1
    level: beginner
    question: Что такое function?
    simple_answer: Это блок кода, который выполняет одну задачу.
    interview_answer: Функция принимает входные данные, выполняет логику и может возвращать результат.
    real_usage: Функции используются в обработчиках HTTP, вычислениях и валидации.
    follow_up_questions:
      - Почему функции упрощают поддержку кода?
      - Что такое аргументы и возвращаемые значения?
    practice_task: Напишите функцию, которая складывает два числа.
  - id: 10
    topic_id: 1
    level: beginner
    question: Что такое error?
    simple_answer: Это значение, которое показывает, что что-то пошло не так.
    interview_answer: В Go error — это обычный тип данных для явной обработки ошибок.
    real_usage: Ошибки используются при работе с сетью, файлами, JSON и валидацией.
    follow_up_questions:
      - Почему в Go ошибки обрабатывают явно?
      - Что значит вернуть nil error?
    practice_task: Напишите функцию, которая возвращает ошибку для отрицательного числа.

  - id: 11
    topic_id: 2
    level: beginner
    question: "Что такое Python?"
    simple_answer: "Python — это простой язык программирования для автоматизации, анализа данных и AI/ML."
    interview_answer: "Python — интерпретируемый язык с лаконичным синтаксисом. Его часто выбирают для скриптов, анализа данных, обучения моделей и прототипирования."
    real_usage: "Python используют для ML-пайплайнов, внутренних учебных инструментов и обработки нейтральных данных."
    follow_up_questions:
      - "Почему Python популярен в AI/ML?"
      - "Чем Python удобен для быстрых прототипов?"
    practice_task: "Напишите скрипт, который выводит список из трёх строк."

  - id: 12
    topic_id: 2
    level: beginner
    question: "Где Python используется в AI/ML?"
    simple_answer: "Python используют для подготовки данных, обучения моделей и запуска экспериментов."
    interview_answer: "Python широко применяют в AI/ML благодаря библиотекам, удобству экспериментов и большому сообществу разработчиков."
    real_usage: "Используется в подготовке датасетов, обучении моделей, оценке качества и автоматизации экспериментов."
    follow_up_questions:
      - "Почему экосистема библиотек важна?"
      - "Какие задачи в ML удобно решать на Python?"
    practice_task: "Назовите три учебные задачи, которые можно автоматизировать на Python."

  - id: 13
    topic_id: 2
    level: beginner
    question: "Что такое script?"
    simple_answer: "Это короткая программа для автоматизации задачи."
    interview_answer: "Скрипт обычно решает узкую задачу: преобразование данных, запуск проверки, сбор отчёта или автоматизацию рутины."
    real_usage: "Скрипты помогают ускорять повторяющиеся процессы и уменьшать ручную работу."
    follow_up_questions:
      - "Чем скрипт отличается от сервиса?"
      - "Почему скрипты удобны для автоматизации?"
    practice_task: "Напишите идею скрипта для переименования учебных файлов."

  - id: 14
    topic_id: 2
    level: beginner
    question: "Что такое virtual environment?"
    simple_answer: "Это изолированное окружение для зависимостей проекта."
    interview_answer: "Virtual environment позволяет держать зависимости одного проекта отдельно от другого и избегать конфликтов версий."
    real_usage: "Используется в Python-проектах для воспроизводимости и контроля зависимостей."
    follow_up_questions:
      - "Почему не стоит устанавливать все пакеты в глобальное окружение?"
      - "Как окружение помогает разработчикам?"
    practice_task: "Опишите, зачем нужен отдельный venv для учебного проекта."

  - id: 15
    topic_id: 2
    level: beginner
    question: "Что такое pip?"
    simple_answer: "Это менеджер пакетов Python."
    interview_answer: "pip устанавливает и обновляет Python-библиотеки из репозиториев пакетов. Это стандартный способ подключать зависимости."
    real_usage: "Используется для установки библиотек в проектах, автоматизации и ML-экспериментах."
    follow_up_questions:
      - "Чем менеджер пакетов отличается от виртуального окружения?"
      - "Почему важно фиксировать версии пакетов?"
    practice_task: "Создайте виртуальное окружение и выведите список установленных пакетов."

  - id: 16
    topic_id: 3
    level: beginner
    question: "Что такое искусственный интеллект?"
    simple_answer: "Это системы, которые выполняют задачи, связанные с распознаванием, прогнозом и обработкой информации."
    interview_answer: "Искусственный интеллект — это широкий класс методов, которые позволяют системам находить закономерности, принимать решения и автоматизировать интеллектуальные задачи."
    real_usage: "Используется в поиске, рекомендациях, обработке текста, изображений и поддержке принятия решений."
    follow_up_questions:
      - "Чем AI отличается от обычной автоматизации?"
      - "Какие задачи хорошо подходят для AI?"
    practice_task: "Приведите три нейтральных примера AI-функций в учебном продукте."

  - id: 17
    topic_id: 3
    level: beginner
    question: "Что такое машинное обучение?"
    simple_answer: "Это способ учить модель на данных, чтобы она делала прогнозы или классифицировала объекты."
    interview_answer: "Машинное обучение — это набор методов, где система учится на примерах и затем применяет найденные закономерности к новым данным."
    real_usage: "Используется в прогнозах, классификации, ранжировании, обнаружении аномалий и персонализации."
    follow_up_questions:
      - "Почему данные важны для ML?"
      - "Где ML полезнее ручных правил?"
    practice_task: "Опишите учебную задачу, где можно использовать ML вместо набора правил."

  - id: 18
    topic_id: 3
    level: beginner
    question: "Чем AI отличается от ML?"
    simple_answer: "AI — более широкое понятие, а ML — его часть."
    interview_answer: "AI включает методы создания интеллектуального поведения, а ML — подход внутри AI, где система учится на данных."
    real_usage: "В программных продуктах AI может включать правила, поиск и модели, а ML относится к обучаемым моделям."
    follow_up_questions:
      - "Почему ML считают частью AI?"
      - "Можно ли создать AI-систему без ML?"
    practice_task: "Сравните AI и ML в двух коротких предложениях."

  - id: 19
    topic_id: 3
    level: beginner
    question: "Что такое модель?"
    simple_answer: "Это математическое представление, которое делает прогнозы по данным."
    interview_answer: "Модель — это обученная система, которая получает входные данные и выдаёт прогноз, ответ или оценку."
    real_usage: "Модели используются в классификации, ранжировании, генерации текста и анализе изображений."
    follow_up_questions:
      - "Чем модель отличается от алгоритма?"
      - "Почему модель нужно проверять на новых данных?"
    practice_task: "Назовите один пример модели для нейтрального учебного проекта."

  - id: 20
    topic_id: 3
    level: beginner
    question: "Что такое датасет?"
    simple_answer: "Это набор данных для обучения, проверки или тестирования модели."
    interview_answer: "Датасет — структурированная коллекция примеров, по которым учатся и оцениваются модели. Качество датасета сильно влияет на результат."
    real_usage: "Используется на всех этапах ML-процесса: подготовке, обучении, оценке и анализе ошибок."
    follow_up_questions:
      - "Почему качество данных может быть важнее объёма?"
      - "Чем обучающий набор отличается от тестового?"
    practice_task: "Придумайте нейтральный датасет из трёх полей для учебной задачи."

  - id: 21
    topic_id: 3
    level: beginner
    question: "Что такое обучение модели?"
    simple_answer: "Это процесс настройки модели на данных."
    interview_answer: "Во время обучения модель подбирает внутренние параметры так, чтобы лучше решать задачу на примерах из датасета."
    real_usage: "Используется при создании рекомендательных систем, классификаторов и генеративных моделей."
    follow_up_questions:
      - "Что такое переобучение?"
      - "Почему обучение и inference — разные режимы?"
    practice_task: "Объясните обучение модели одной простой фразой."

  - id: 22
    topic_id: 3
    level: beginner
    question: "Что такое inference?"
    simple_answer: "Это использование обученной модели для получения ответа на новых данных."
    interview_answer: "Inference — это режим, в котором модель уже не учится, а делает предсказание или генерацию по входному запросу."
    real_usage: "Используется в работающих приложениях, когда модель отвечает на запрос или обрабатывает событие."
    follow_up_questions:
      - "Чем inference отличается от обучения?"
      - "Почему inference стараются ускорять?"
    practice_task: "Приведите нейтральный пример inference в поиске или учебном чате."

  - id: 23
    topic_id: 3
    level: beginner
    question: "Что такое prompt?"
    simple_answer: "Это текстовая инструкция для модели."
    interview_answer: "Prompt задаёт контекст, цель, ограничения и формат ответа. От качества prompt часто зависит полезность результата."
    real_usage: "Используется в чатах, генерации текста, классификации и задачах извлечения информации."
    follow_up_questions:
      - "Почему формулировка prompt важна?"
      - "Что будет, если prompt слишком общий?"
    practice_task: "Напишите короткий prompt для объяснения учебного термина простыми словами."

  - id: 24
    topic_id: 3
    level: beginner
    question: "Что такое embedding?"
    simple_answer: "Это числовое представление текста, кода или другого объекта."
    interview_answer: "Embedding переводит объект в вектор, чтобы сравнивать похожесть, искать семантически близкие фрагменты и строить рекомендации."
    real_usage: "Используется в поиске, рекомендациях, оценке семантического сходства и RAG."
    follow_up_questions:
      - "Почему вектор полезен для поиска?"
      - "Как embedding помогает сравнивать тексты?"
    practice_task: "Объясните назначение embedding в одном предложении."

  - id: 25
    topic_id: 3
    level: beginner
    question: "Что такое RAG?"
    simple_answer: "Это подход, где модель сначала ищет нужные данные, а потом формирует ответ."
    interview_answer: "RAG объединяет поиск по базе знаний и генерацию ответа. Сначала система находит релевантный контекст, затем модель использует его для ответа."
    real_usage: "Используется в справочных и учебных системах, где важно отвечать на основе актуальных нейтральных материалов."
    follow_up_questions:
      - "Почему RAG полезен для работы со знаниями?"
      - "Чем RAG отличается от обычного prompt?"
    practice_task: "Опишите RAG как цепочку из двух шагов."

  - id: 26
    topic_id: 4
    level: beginner
    question: "Как отвечать на технический вопрос?"
    simple_answer: "Сначала нужно кратко дать определение, а затем пояснить его на примере."
    interview_answer: "Лучше отвечать структурно: определить термин, объяснить смысл, привести пример и при необходимости отметить ограничения или компромиссы."
    real_usage: "Так отвечают на собеседованиях, при проверке кода и на технических обсуждениях."
    follow_up_questions:
      - "Почему структура ответа помогает?"
      - "Что делать, если вопрос слишком широкий?"
    practice_task: "Сформулируйте ответ на учебный вопрос по шаблону: определение, пример, вывод."

  - id: 27
    topic_id: 4
    level: beginner
    question: "Что делать, если не знаешь ответ?"
    simple_answer: "Спокойно сказать, что точный ответ неизвестен, и объяснить, как начать разбираться."
    interview_answer: "Хороший ответ показывает честность и ход мысли. Можно назвать известные факты, предположения и шаги проверки."
    real_usage: "Это важно для технических интервью, разбора ошибок и обсуждения архитектуры."
    follow_up_questions:
      - "Почему честность лучше угадывания?"
      - "Как показать ход мысли без точного ответа?"
    practice_task: "Напишите короткий честный ответ на сложный учебный вопрос без выдумок."

  - id: 28
    topic_id: 4
    level: beginner
    question: "Как объяснять решение простыми словами?"
    simple_answer: "Нужно убрать лишние детали и описать цель, шаги и результат."
    interview_answer: "Простое объяснение строится вокруг задачи: что было нужно, что сделали, почему именно так и какой получился результат."
    real_usage: "Это помогает на интервью, демонстрациях и технических обсуждениях."
    follow_up_questions:
      - "Почему простота важна для понимания?"
      - "Когда стоит добавить больше деталей?"
    practice_task: "Объясните сложную учебную идею в двух коротких предложениях."

  - id: 29
    topic_id: 4
    level: beginner
    question: "Что такое компромисс в архитектуре?"
    simple_answer: "Это осознанный выбор между плюсами и минусами разных решений."
    interview_answer: "Компромисс в архитектуре означает баланс между скоростью, простотой, масштабируемостью, стоимостью и удобством поддержки."
    real_usage: "Используется при выборе хранилища, очереди, кэша, формата API и схемы развёртывания."
